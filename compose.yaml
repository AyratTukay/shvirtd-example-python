include:
  - proxy.yaml
services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: YtReWq4321
      MYSQL_DATABASE: virtd
      MYSQL_USER: app
      MYSQL_PASSWORD: QwErTy1234
      MYSQL_ROOT_HOST: "%"
#    env_file: .env
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      backend:
        ipv4_address: 172.20.0.10
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  web:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: web
    ports:
      - "5000:5000"
#    env_file: .env
    environment:
      - DATABASE_URL=mysql://app:QwErTy1234@db:3306/virtd
      - DB_HOST=172.20.0.10
      - DB_PORT=3306
      - DB_USER=app
      - DB_PASSWORD=QwErTy1234
      - DB_NAME=virtd
    networks:
      backend:
        ipv4_address: 172.20.0.5
    extra_hosts:
      - "127.0.0.1:172.20.0.10"
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
volumes:
  mysql_data: {}
